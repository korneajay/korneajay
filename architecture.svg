<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Animated request flow through Kisan Fertilize architecture" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><clipPath id="card"><rect width="900" height="300" rx="16"/></clipPath></defs>
<g clip-path="url(#card)">
<rect width="900" height="300" fill="#0d1117"/>
<text x="24" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Kisan Fertilize: request flow</text>
<text x="24" y="54" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">3 roles, OTP authentication, per-farmer quota enforcement</text>
<rect x="200" y="62" width="44" height="18" rx="9" fill="none" stroke="#a371f7" stroke-width="1"/><text x="222" y="75" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#a371f7">Farmer</text><rect x="247" y="62" width="44" height="18" rx="9" fill="none" stroke="#a371f7" stroke-width="1"/><text x="269" y="75" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#a371f7">Dealer</text><rect x="294" y="62" width="44" height="18" rx="9" fill="none" stroke="#a371f7" stroke-width="1"/><text x="316" y="75" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#a371f7">Admin</text>
<rect x="20" y="95" width="140" height="100" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="stroke" values="#58a6ff;#30363d;#3fb950" keyTimes="0;0.07;0.93" calcMode="discrete" dur="8s" repeatCount="indefinite"/></rect>
<text x="90" y="125" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">React UI</text>
<text x="90" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">Farmer / Dealer</text>
<text x="90" y="167" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">/ Admin screens</text>
<line x1="90" y1="195" x2="90" y2="225" stroke="#30363d" stroke-width="2"/>
<rect x="200" y="95" width="140" height="100" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="stroke" values="#30363d;#58a6ff;#30363d;#3fb950;#30363d" keyTimes="0;0.125;0.195;0.875;0.945" calcMode="discrete" dur="8s" repeatCount="indefinite"/></rect>
<text x="270" y="125" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Spring Boot API</text>
<text x="270" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">REST controllers</text>
<text x="270" y="167" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">OTP auth, role check</text>
<line x1="270" y1="195" x2="270" y2="225" stroke="#30363d" stroke-width="2"/>
<rect x="380" y="95" width="140" height="100" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="stroke" values="#30363d;#58a6ff;#30363d;#3fb950;#30363d" keyTimes="0;0.250;0.320;0.750;0.820" calcMode="discrete" dur="8s" repeatCount="indefinite"/></rect>
<text x="450" y="125" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Service Layer</text>
<text x="450" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">Booking logic</text>
<text x="450" y="167" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">Quota enforcement</text>
<line x1="450" y1="195" x2="450" y2="225" stroke="#30363d" stroke-width="2"/>
<rect x="560" y="95" width="140" height="100" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="stroke" values="#30363d;#58a6ff;#30363d;#3fb950;#30363d" keyTimes="0;0.375;0.445;0.625;0.695" calcMode="discrete" dur="8s" repeatCount="indefinite"/></rect>
<text x="630" y="125" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Hibernate / JPA</text>
<text x="630" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">Entities, ORM</text>
<text x="630" y="167" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">Transactions</text>
<line x1="630" y1="195" x2="630" y2="225" stroke="#30363d" stroke-width="2"/>
<rect x="740" y="95" width="140" height="100" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="stroke" values="#30363d;#58a6ff;#3fb950;#30363d" keyTimes="0;0.5;0.54;0.62" calcMode="discrete" dur="8s" repeatCount="indefinite"/></rect>
<text x="810" y="125" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">MySQL</text>
<text x="810" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">Persistent store</text>
<text x="810" y="167" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">Bookings, quotas</text>
<line x1="810" y1="195" x2="810" y2="225" stroke="#30363d" stroke-width="2"/>

<line x1="90" y1="225" x2="810" y2="225" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4 8" opacity="0.5"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.5s" repeatCount="indefinite"/></line>
<circle r="7" fill="#58a6ff"><animateMotion path="M90,225 L810,225 L90,225" dur="8s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="fill" values="#58a6ff;#3fb950" keyTimes="0;0.5" calcMode="discrete" dur="8s" repeatCount="indefinite"/></circle>
<circle cx="330" cy="274" r="5" fill="#58a6ff"/><text x="342" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">request</text>
<circle cx="440" cy="274" r="5" fill="#3fb950"/><text x="452" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">response</text>
</g></svg>
